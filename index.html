<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi QR - SD Negeri 1 Sumber Mulya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Konfigurasi Tailwind Custom (Tema Hijau) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            excel: {
              800: '#1e7e34', // Hijau tua solid
              900: '#145c23', // Hijau sangat tua
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- ================= NOTIFIKASI ================= -->
  <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 hidden transition-opacity duration-300">
    <div id="toast-message" class="px-6 py-3 rounded-lg shadow-lg text-white font-semibold"></div>
  </div>

  <!-- ================= HALAMAN LOGIN ================= -->
  <div id="login-page" class="min-h-screen flex items-center justify-center bg-gray-200">
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md border-t-8 border-excel-800">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Portal Absensi</h1>
        <p class="text-sm text-gray-500">SD Negeri 1 Sumber Mulya</p>
      </div>
      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="username" class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-excel-800 focus:border-excel-800" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-excel-800 focus:border-excel-800" required>
        </div>
        <button type="submit" id="btn-login" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-white bg-excel-800 hover:bg-excel-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-excel-800 transition">
          Masuk
        </button>
      </form>
    </div>
  </div>

  <!-- ================= HALAMAN UTAMA (DASHBOARD & SCANNER) ================= -->
  <div id="main-page" class="hidden min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-excel-800 text-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div class="flex-shrink-0 flex items-center gap-2">
            <span class="font-bold text-lg tracking-wide">Absensi<span class="font-light">QR</span></span>
          </div>
          <div class="flex items-center gap-4">
            <span id="user-info" class="text-sm hidden sm:block font-medium"></span>
            <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded transition">Keluar</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Content -->
    <main class="flex-grow w-full max-w-4xl mx-auto p-4 sm:p-6">
      
      <!-- Panel Scanner -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
          <h2 class="text-lg font-bold text-gray-700">Scanner QR Siswa</h2>
          <button id="btn-toggle-cam" onclick="toggleScanner()" class="px-4 py-2 bg-excel-800 text-white text-sm font-medium rounded shadow hover:bg-excel-900 transition">
            Mulai Scan
          </button>
        </div>
        
        <div class="p-6">
          <div id="reader-container" class="hidden mx-auto w-full max-w-md overflow-hidden rounded-lg border-2 border-dashed border-gray-300">
            <div id="reader"></div>
          </div>
          
          <!-- Area Hasil Scan Terakhir -->
          <div id="scan-result" class="mt-6 hidden">
            <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-r shadow-sm">
              <div class="flex">
                <div class="flex-shrink-0">
                  <svg class="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <div class="ml-3">
                  <h3 class="text-lg font-medium text-green-800">Berhasil Absen!</h3>
                  <div class="mt-2 text-sm text-green-700">
                    <p>Nama: <span id="res-nama" class="font-bold"></span></p>
                    <p>Kelas: <span id="res-kelas" class="font-bold"></span></p>
                    <p>Status: <span id="res-status" class="font-bold px-2 py-0.5 rounded text-white mt-1 inline-block"></span></p>
                    <p class="text-xs mt-1 text-green-600">Jam: <span id="res-jam"></span></p>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
